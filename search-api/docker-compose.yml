services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    networks:
      - search-net
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: search-redis
    command: redis-server --save "" --appendonly no
    networks:
      - search-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build: ./api
    container_name: search-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - searxng
      - redis
    networks:
      - search-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: nginx:alpine
    container_name: search-frontend
    ports:
      - "3001:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - search-net
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: search-tunnel
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api
    networks:
      - search-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  search-net:
    driver: bridge
